name: Build & Publish Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAIN_MODULE: app
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          printf 'MAPS_API_KEY=%s\n' '${{ secrets.MAPS_API_KEY }}' > local.properties

      - name: Verify Release Sources
        run: >-
          ./gradlew
          --build-cache
          --configuration-cache
          ktlintCheck
          :${{ env.MAIN_MODULE }}:lintDebug
          :${{ env.MAIN_MODULE }}:testDebugUnitTest

      - name: Build Release APK + AAB
        run: >-
          ./gradlew
          --build-cache
          --configuration-cache
          :${{ env.MAIN_MODULE }}:assembleRelease
          :${{ env.MAIN_MODULE }}:bundleRelease

      - name: Sign release APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ env.MAIN_MODULE }}/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Sign release AAB
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ env.MAIN_MODULE }}/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" app-release.apk

      - name: Rename AAB
        run: |
          mv "${{ steps.sign_aab.outputs.signedReleaseFile }}" app-release.aab

      - name: Upload artifacts (Actions)
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          if-no-files-found: error
          retention-days: 14
          path: |
            app-release.apk
            app-release.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app-release.apk
            app-release.aab
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false

      - name: Cleanup secrets
        if: always()
        run: rm -f local.properties
