name: Build and Test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  MAIN_MODULE: app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" > local.properties
          fi

      - name: Run Build, Lint, and Test
        run: >-
          ./gradlew
          --build-cache
          --configuration-cache
          ktlintCheck
          :${{ env.MAIN_MODULE }}:assembleDebug
          :${{ env.MAIN_MODULE }}:testDebugUnitTest
          :${{ env.MAIN_MODULE }}:lintDebug

      - name: Cleanup
        if: always()
        run: rm -f local.properties
